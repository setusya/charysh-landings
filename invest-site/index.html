<section style="padding:clamp(56px,8vw,104px) 0;background:#F3EFEA"><div style="max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:32px"><div style="display:flex;flex-direction:column;gap:14px;max-width:820px"><div aria-hidden="true" class="kick" style="display:flex;align-items:center;gap:14px;color:#87000d"><span class="kh"></span><span style="font-size:13px;font-weight:500;letter-spacing:.2em">02</span><span style="flex:0 1 64px;height:1px;background:currentColor;opacity:.5"></span></div><h2 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:clamp(32px,3.8vw,50px);line-height:1.08;font-weight:500;color:#87000d;text-wrap:balance">Что получает акционер</h2></div><div style="overflow-x:auto"><table style="width:100%;min-width:560px;border-collapse:collapse;font-size:15.5px;line-height:1.5"><thead><tr><th scope="col" style="padding:12px 16px;text-align:left;font-weight:500;color:#6b6762;border-bottom:2px solid #12110c">Параметр</th><th scope="col" style="padding:12px 16px;text-align:left;font-weight:500;color:#6b6762;border-bottom:2px solid #12110c">Значение</th></tr></thead><tbody><tr><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Эмитент</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">АО «Резиденция Тишины Горный Чарыш», ОГРН 1267700198006, ИНН 9728174714</td></tr><tr><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Тип акций</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Привилегированные именные бездокументарные</td></tr><tr><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Регистрационный номер выпуска</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">2-01-12094-G</td></tr><tr><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Номинальная стоимость</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">1 рубль</td></tr><tr><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Цена акции</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)"><span style="background:#FBF6EC;border-bottom:1.5px dashed #b48a3c;padding:0 4px">3 000 рублей — единая для всех покупателей, агент не может её менять</span></td></tr><tr><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Минимальный лот</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)"><span style="background:#FBF6EC;border-bottom:1.5px dashed #b48a3c;padding:0 4px">167 акций = 501 000 рублей</span></td></tr><tr><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Продавец</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Принципал (физическое лицо). Общество не является продавцом и не получает цену автоматически</td></tr><tr><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Регистратор</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">АО «Регистраторское общество «СТАТУС»</td></tr><tr><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Момент перехода права</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Внесение приходной записи регистратором</td></tr><tr><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Преимущественное право</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Акционеров и Общества — по уставу АО</td></tr><tr><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Права акционера</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Согласно уставу и законодательству, включая доступ к информации</td></tr></tbody></table></div><div style="border:1.5px dashed #b48a3c;background:#FBF6EC;border-radius:4px;padding:14px 18px;font-size:14.5px;line-height:1.5;color:#4d3f22"><strong style="color:#8a6a2c">Уточнить до публикации. </strong>Цену и минимальный лот ТЗ разрешает публиковать только после заключения юриста по рынку ценных бумаг: иначе это может быть признано публичным предложением.</div></div></section>
<section id="know" style="padding:clamp(56px,8vw,104px) 0"><div style="max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:32px"><div style="display:flex;flex-direction:column;gap:14px;max-width:820px"><div aria-hidden="true" class="kick" style="display:flex;align-items:center;gap:14px;color:#87000d"><span class="kh"></span><span style="font-size:13px;font-weight:500;letter-spacing:.2em">03</span><span style="flex:0 1 64px;height:1px;background:currentColor;opacity:.5"></span></div><h2 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:clamp(32px,3.8vw,50px);line-height:1.08;font-weight:500;color:#87000d;text-wrap:balance">Что важно знать до покупки</h2></div><ul style="padding-left:20px;display:flex;flex-direction:column;gap:8px"><li>Акции являются привилегированными именными бездокументарными акциями непубличного акционерного общества.</li><li>Продавцом акций является Принципал — физическое лицо; Общество не является продавцом акций и не получает цену автоматически.</li><li>Покупатель становится акционером только после внесения приходной записи регистратором.</li><li>Покупка акций не является займом, вкладом, депозитом, доверительным управлением или оплатой услуги.</li><li>Акции могут быть неликвидными: организованного рынка и обязанности третьего лица купить их нет.</li><li>Дивиденды, доходность, окупаемость, рост стоимости, срок выхода, возврат цены и обратный выкуп не гарантированы.</li><li>Акционер не получает прямого права на землю, здание, гостиничный номер или иное имущество Общества.</li><li>Цена акции стандартная и единая для всех покупателей, агент не может её изменить.</li><li>Для физических лиц: если продавец владел акциями меньше 5 лет, НДФЛ при продаже платит он; покупатель-физлицо не является налоговым агентом и НДФЛ при покупке не платит.</li><li>Действует преимущественное право акционеров и Общества, предусмотренное уставом.</li></ul></div></section>
<section style="padding:clamp(56px,8vw,104px) 0;background:#F3EFEA"><div style="max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:32px"><div style="display:flex;flex-direction:column;gap:14px;max-width:820px"><div aria-hidden="true" class="kick" style="display:flex;align-items:center;gap:14px;color:#87000d"><span class="kh"></span><span style="font-size:13px;font-weight:500;letter-spacing:.2em">04</span><span style="flex:0 1 64px;height:1px;background:currentColor;opacity:.5"></span></div><h2 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:clamp(32px,3.8vw,50px);line-height:1.08;font-weight:500;color:#87000d;text-wrap:balance">Факторы стоимости и риски</h2></div><div class="snap" style="display:flex;flex-wrap:wrap;gap:16px"><div style="flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:8px;padding:22px;background:#FFFFFF;border:1px solid rgba(18,17,12,.15);border-radius:4px"><h3 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:24px;line-height:1.2;font-weight:500;color:#87000d;font-size:20px">Стадия проекта</h3><p style="font-size:15.5px">Курорт строится, плановое открытие — апрель 2028 года.</p></div><div style="flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:8px;padding:22px;background:#FFFFFF;border:1px solid rgba(18,17,12,.15);border-radius:4px"><h3 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:24px;line-height:1.2;font-weight:500;color:#87000d;font-size:20px">Спрос</h3><p style="font-size:15.5px">Спрос на курортный отдых и недвижимость может снизиться.</p></div><div style="flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:8px;padding:22px;background:#FFFFFF;border:1px solid rgba(18,17,12,.15);border-radius:4px"><h3 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:24px;line-height:1.2;font-weight:500;color:#87000d;font-size:20px">Инфраструктура</h3><p style="font-size:15.5px">Сроки строительства и подключения к сетям могут сдвинуться.</p></div><div style="flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:8px;padding:22px;background:#FFFFFF;border:1px solid rgba(18,17,12,.15);border-radius:4px"><h3 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:24px;line-height:1.2;font-weight:500;color:#87000d;font-size:20px">Операционные</h3><p style="font-size:15.5px">Загрузка может быть ниже плановой.</p></div><div style="flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:8px;padding:22px;background:#FFFFFF;border:1px solid rgba(18,17,12,.15);border-radius:4px"><h3 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:24px;line-height:1.2;font-weight:500;color:#87000d;font-size:20px">Рыночные и юридические</h3><p style="font-size:15.5px">Изменения рынка и законодательства.</p></div><div style="flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:8px;padding:22px;background:#FFFFFF;border:1px solid rgba(18,17,12,.15);border-radius:4px"><h3 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:24px;line-height:1.2;font-weight:500;color:#87000d;font-size:20px">Ликвидность</h3><p style="font-size:15.5px">Акции могут быть неликвидными.</p></div></div><p style="font-size:15px;color:#6b6762">Расширенный перечень рисков — в инвестиционном меморандуме после подписания NDA.</p></div></section>

,17,12,.2)">Предоставление недостоверных сведений</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)"><span style="background:#FBF6EC;border-bottom:1.5px dashed #b48a3c;padding:0 4px">сумма уточняется</span></td></tr><tr><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">16.8</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Просрочка оплаты услуг УК</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">0,1% за день, не более 10%</td></tr><tr><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">16.9</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Просрочка иных денежных обязательств</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">0,1% за день</td></tr><tr><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">16.12</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Возмещение убытков</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">Сверх штрафа и неустойки</td></tr></tbody></table></div><div style="display:flex;flex-wrap:wrap;gap:24px 56px"><div style="flex:1 1 380px;min-width:0"><h3 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:24px;line-height:1.2;font-weight:500;color:#87000d;margin-bottom:8px">Как фиксируется нарушение</h3><ol style="margin:0;padding:0;list-style:none;border-bottom:1px solid rgba(18,17,12,.25)"><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">1</span><div style="min-width:0"><p style="font-weight:500">Акт</p><p style="font-size:15.5px;color:#3a3835">Факт нарушения фиксируется актом: описание, ссылка на пункт СПЗ, дата, место, подпись.</p></div></li><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">2</span><div style="min-width:0"><p style="font-weight:500">Направление</p><p style="font-size:15.5px;color:#3a3835">Акт направляется участнику в течение 5 рабочих дней.</p></div></li><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">3</span><div style="min-width:0"><p style="font-weight:500">Возражения</p><p style="font-size:15.5px;color:#3a3835">Участник вправе представить возражения в течение 10 рабочих дней. Без возражений акт считается принятым.</p></div></li></ol></div><div style="flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:10px"><h3 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:24px;line-height:1.2;font-weight:500;color:#87000d">Как оплачивается штраф</h3><p>В течение 10 рабочих дней с даты получения требования. При неуплате сумма списывается из обеспечительного платежа.</p></div></div><div style="border:1.5px dashed #b48a3c;background:#FBF6EC;border-radius:4px;padding:14px 18px;font-size:14.5px;line-height:1.5;color:#4d3f22"><strong style="color:#8a6a2c">Уточнить до публикации. </strong>В ТЗ не заполнены суммы штрафов по пунктам 16.2, 16.4–16.7.</div></div></section>

er-bottom:1px solid rgba(18,17,12,.2)">2</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">1</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">7 × 9,5 м</td></tr><tr><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">«Пихта»</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">90 м²</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">2</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">1</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">8 × 12 м</td></tr><tr><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">«Кедр»</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)"><span style="background:#FBF6EC;border-bottom:1.5px dashed #b48a3c;padding:0 4px">134 м²</span></td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">3</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">2</td><td style="padding:12px 16px;vertical-align:top;border-bottom:1px solid rgba(18,17,12,.2)">13,55 × 14,52 м</td></tr></tbody></table></div><ul style="padding-left:20px;display:flex;flex-direction:column;gap:8px"><li>ВРИ: «Туристическое обслуживание, природно-познавательный туризм».</li><li>Категория земель: земли населённых пунктов.</li><li>Домокомплекты из клеёного бруса — ООО «ЛХК «Алтайлес» (ИНН 2225086755, ОГРН 1072225006798).</li><li>Строительство — исключительно силами ООО «Чарыш Девелопмент».</li></ul><div style="border:1.5px dashed #b48a3c;background:#FBF6EC;border-radius:4px;padding:14px 18px;font-size:14.5px;line-height:1.5;color:#4d3f22"><strong style="color:#8a6a2c">Уточнить до публикации. </strong>Площадь «Кедра»: в одном месте ТЗ 134 м², в другом — 140 м².</div></div></section>
<section id="terms" style="padding:clamp(56px,8vw,104px) 0;background:#F3EFEA"><div style="max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:32px"><div style="display:flex;flex-direction:column;gap:14px;max-width:820px"><div aria-hidden="true" class="kick" style="display:flex;align-items:center;gap:14px;color:#87000d"><span class="kh"></span><span style="font-size:13px;font-weight:500;letter-spacing:.2em">05</span><span style="flex:0 1 64px;height:1px;background:currentColor;opacity:.5"></span></div><h2 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:clamp(32px,3.8vw,50px);line-height:1.08;font-weight:500;color:#87000d;text-wrap:balance">Условия приобретения</h2></div><ol style="margin:0;padding:0;list-style:none;border-bottom:1px solid rgba(18,17,12,.25)"><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">1</span><div style="min-width:0"><p style="font-weight:500">Покупка участка</p><p style="font-size:15.5px;color:#3a3835">Покупатель — индивидуальный предприниматель или юридическое лицо. Договор купли-продажи с Принципалом.</p></div></li><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">2</span><div style="min-width:0"><p style="font-weight:500">Договор подряда в течение 30 дней</p><p style="font-size:15.5px;color:#3a3835">После регистрации права собственности на участок Покупатель в течение 30 календарных дней заключает договор строительного подряда с ООО «Чарыш Девелопмент».</p></div></li><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">3</span><div style="min-width:0"><p style="font-weight:500">Строительство</p><p style="font-size:15.5px;color:#3a3835">Дом строит исключительно ООО «Чарыш Девелопмент». Другой подрядчик — только с письменного согласия Девелопера.</p></div></li><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">4</span><div style="min-width:0"><p style="font-weight:500">Договор эксплуатации в течение 30 дней</p><p style="font-size:15.5px;color:#3a3835">После завершения строительства и регистрации права на дом Покупатель в течение 30 календарных дней заключает договор эксплуатации инфраструктуры с Оператором — ООО «Чарыш Партнерс».</p></div></li></ol><p style="font-weight:500">Несоблюдение обязательств влечёт утрату задатка и применение штрафных санкций по Соглашению о правилах застройки.</p><p style="font-size:14px;line-height:1.55;color:#6b6762;max-width:90ch">Присвоение дому статуса «гостевой дом» зависит от решения уполномоченного органа и не гарантируется. Участки не предназначены для ИЖС и постоянного проживания; смена ВРИ не обещается.</p></div></section>

<section id="how" style="padding:clamp(56px,8vw,104px) 0"><div style="max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:32px"><div style="display:flex;flex-direction:column;gap:14px;max-width:820px"><div aria-hidden="true" class="kick" style="display:flex;align-items:center;gap:14px;color:#87000d"><span class="kh"></span><span style="font-size:13px;font-weight:500;letter-spacing:.2em">02</span><span style="flex:0 1 64px;height:1px;background:currentColor;opacity:.5"></span></div><h2 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:clamp(32px,3.8vw,50px);line-height:1.08;font-weight:500;color:#87000d;text-wrap:balance">Как это работает</h2></div><ol style="margin:0;padding:0;list-style:none;border-bottom:1px solid rgba(18,17,12,.25)"><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">1</span><div style="min-width:0"><p style="font-weight:500">Регистрация</p><p style="font-size:15.5px;color:#3a3835">Подайте заявку и подпишите агентский договор.</p></div></li><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">2</span><div style="min-width:0"><p style="font-weight:500">Доступ к базе</p><p style="font-size:15.5px;color:#3a3835">Получите доступ к публичным таблицам с актуальными статусами и ценами участков и акций.</p></div></li><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">3</span><div style="min-width:0"><p style="font-weight:500">Представление клиента</p><p style="font-size:15.5px;color:#3a3835">Внесите потенциального покупателя в Реестр до начала активных переговоров.</p></div></li><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">4</span><div style="min-width:0"><p style="font-weight:500">Сделка</p><p style="font-size:15.5px;color:#3a3835">Принципал проводит сделку, вы получаете вознаграждение после её завершения.</p></div></li></ol></div></section>
<section id="contract" style="padding:clamp(56px,8vw,104px) 0;background:#F3EFEA"><div style="max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:32px"><div style="display:flex;flex-direction:column;gap:14px;max-width:820px"><div aria-hidden="true" class="kick" style="display:flex;align-items:center;gap:14px;color:#87000d"><span class="kh"></span><span style="font-size:13px;font-weight:500;letter-spacing:.2em">03</span><span style="flex:0 1 64px;height:1px;background:currentColor;opacity:.5"></span></div><h2 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:clamp(32px,3.8vw,50px);line-height:1.08;font-weight:500;color:#87000d;text-wrap:balance">Агентский договор</h2><p style="font-size:clamp(17px,1.4vw,19px);max-width:68ch">Ознакомьтесь с условиями сотрудничества до подачи заявки.</p></div><div><a href="#request" style="display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;background:#87000d;color:#FFFFFF;font-weight:500;font-size:16px;text-decoration:none;border-radius:4px;border:0;cursor:pointer">Скачать шаблон договора</a></div><ul style="padding-left:20px;display:flex;flex-direction:column;gap:8px"><li>Вознаграждение — 4% от фактически полученной Принципалом суммы по договору купли-продажи объекта и/или акций.</li><li>Вознаграждение выплачивается только за завершённую сделку с представленным лицом.</li><li>Реестр представленных лиц — единственное доказательство того, что лицо представил агент.</li><li>Регистрация действительна 3 месяца с даты последнего документально подтверждённого контакта.</li><li>Защитный период — 6 месяцев после прекращения договора.</li><li>Агент не вправе подписывать договоры от имени Принципала, получать деньги, подавать документы на регистрацию и менять цену.</li><li>Перед началом переговоров агент обязан свериться с публичными таблицами участков и акций.</li><li>До передачи проекта договора агент передаёт покупателю полный пакет документов проекта; это подтверждается подписью покупателя в акте показа.</li><li>Штраф за разглашение конфиденциальной информации — 500 000 рублей за каждый случай.</li></ul></div></section>
<section id="registry" style="padding:clamp(56px,8vw,104px) 0"><div style="max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:32px"><div style="display:flex;flex-direction:column;gap:14px;max-width:820px"><div aria-hidden="true" class="kick" style="display:flex;align-items:center;gap:14px;color:#87000d"><span class="kh"></span><span style="font-size:13px;font-weight:500;letter-spacing:.2em">04</span><span style="flex:0 1 64px;height:1px;background:currentColor;opacity:.5"></span></div><h2 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:clamp(32px,3.8vw,50px);line-height:1.08;font-weight:500;color:#87000d;text-wrap:balance">Регламент работы с Реестром</h2></div><ol style="margin:0;padding:0;list-style:none;border-bottom:1px solid rgba(18,17,12,.25)"><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">1</span><div style="min-width:0"><p style="font-weight:500">Уведомление за 3 дня</p><p style="font-size:15.5px;color:#3a3835">Не позднее 3 календарных дней с начала переговоров агент направляет Принципалу уведомление по форме Приложения № 2 с письменным подтверждением интересанта или актом показа.</p></div></li><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">2</span><div style="min-width:0"><p style="font-weight:500">Запись в Реестр</p><p style="font-size:15.5px;color:#3a3835">Принципал вносит запись в Реестр в день получения уведомления. До этого агент не вправе вести переговоры.</p></div></li><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">3</span><div style="min-width:0"><p style="font-weight:500">Срок годности 3 месяца</p><p style="font-size:15.5px;color:#3a3835">Если 3 месяца нет документально подтверждённого контакта, лицо исключается из Реестра.</p></div></li><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">4</span><div style="min-width:0"><p style="font-weight:500">Доказательства</p><p style="font-size:15.5px;color:#3a3835">Акт показа, подтверждение интересанта, переписка. Бремя доказывания — на агенте.</p></div></li></ol><p style="font-size:15.5px">Если интересант действует через представителя, в Реестр вносится представитель; конечный покупатель считается представленным с даты собственной регистрации. О прямом обращении лица Принципал сообщает агенту в течение 2 рабочих дней.</p></div></section>
<section id="tables" style="padding:clamp(56px,8vw,104px) 0;background:#F3EFEA"><div style="max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:32px"><div style="display:flex;flex-direction:column;gap:14px;max-width:820px"><div aria-hidden="true" class="kick" style="display:flex;align-items:center;gap:14px;color:#87000d"><span class="kh"></span><span style="font-size:13px;font-weight:500;letter-spacing:.2em">05</span><span style="flex:0 1 64px;height:1px;background:currentColor;opacity:.5"></span></div><h2 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:clamp(32px,3.8vw,50px);line-height:1.08;font-weight:500;color:#87000d;text-wrap:balance">Публичные таблицы и бронирование</h2></div><div style="display:flex;flex-wrap:wrap;gap:24px 56px"><div style="flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:10px"><h3 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:24px;line-height:1.2;font-weight:500;color:#87000d">Таблицы участков и акций</h3><ul style="padding-left:20px;display:flex;flex-direction:column;gap:8px"><li>Доступ в режиме «Просмотр».</li><li>Перед переговорами — обязательная сверка с таблицей.</li><li>Статус «Свободен» — можно начинать переговоры; «В переговорах», «Забронирован», «Продан» — нельзя.</li><li>Принципал обновляет таблицы не реже раза в рабочий день.</li></ul></div><div style="flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:10px"><h3 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:24px;line-height:1.2;font-weight:500;color:#87000d">Бронирование участка и лота акций</h3><ul style="padding-left:20px;display:flex;flex-direction:column;gap:8px"><li>Бронь — после задатка по предварительному договору (участок) или соглашения о бронировании (лот акций).</li><li>Запись о брони вносится в публичную таблицу и в Реестр.</li><li>На срок брони Принципал не ведёт переговоры с другими лицами.</li><li>Если основной договор не заключён в срок брони, участок возвращается в статус «Свободен».</li></ul></div></div></div></section>
<section id="cabinet" style="padding:clamp(56px,8vw,104px) 0"><div style="max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:32px"><div style="display:flex;flex-direction:column;gap:14px;max-width:820px"><div aria-hidden="true" class="kick" style="display:flex;align-items:center;gap:14px;color:#87000d"><span class="kh"></span><span style="font-size:13px;font-weight:500;letter-spacing:.2em">06</span><span style="flex:0 1 64px;height:1px;background:currentColor;opacity:.5"></span></div><h2 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:clamp(32px,3.8vw,50px);line-height:1.08;font-weight:500;color:#87000d;text-wrap:balance">Личный кабинет партнёра</h2><p style="font-size:clamp(17px,1.4vw,19px);max-width:68ch">Доступен после верификации.</p></div><div class="snap" style="display:flex;flex-wrap:wrap;gap:16px"><div style="flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:8px;padding:22px;background:#FFFFFF;border:1px solid rgba(18,17,12,.15);border-radius:4px"><h3 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:24px;line-height:1.2;font-weight:500;color:#87000d;font-size:20px">Публичные таблицы</h3><p style="font-size:15.5px">Ссылки на таблицы участков и акций.</p></div><div style="flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:8px;padding:22px;background:#FFFFFF;border:1px solid rgba(18,17,12,.15);border-radius:4px"><h3 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:24px;line-height:1.2;font-weight:500;color:#87000d;font-size:20px">Реестр</h3><p style="font-size:15.5px">Реестр представленных лиц.</p></div><div style="flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:8px;padding:22px;background:#FFFFFF;border:1px solid rgba(18,17,12,.15);border-radius:4px"><h3 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:24px;line-height:1.2;font-weight:500;color:#87000d;font-size:20px">Формы</h3><p style="font-size:15.5px">Уведомление, акт показа, отчёт, акт завершения.</p></div><div style="flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:8px;padding:22px;background:#FFFFFF;border:1px solid rgba(18,17,12,.15);border-radius:4px"><h3 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:24px;line-height:1.2;font-weight:500;color:#87000d;font-size:20px">Библиотека</h3><p style="font-size:15.5px">Презентации и материалы для клиентов.</p></div></div></div></section>

#2f6b3a;color:#FFFFFF;padding:2px 9px;border-radius:4px">Публично</span></div><p style="font-size:15px;color:#3a3835">Обезличенный шаблон. 6 приложений: характеристика объекта и акций, формы реестра, уведомления, акта показа, отчёта и акта о завершении сделки, согласие на обработку ПД.</p></div><a href="#request" style="flex:none;align-self:center;font-weight:500;color:#87000d">Скачать</a></li></ul></sc-if></div><div style="border-bottom:1px solid rgba(18,17,12,.3)"><button type="button" onClick="{{ g5.toggle }}" aria-expanded="{{ g5.open }}" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:64px;padding:16px 0;background:none;border:0;cursor:pointer;text-align:left;color:#12110c"><span style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:22px;font-weight:500">Общие документы <span style="font-size:15px;color:#6b6762;font-weight:400">· 3</span></span><span aria-hidden="true" style="flex:none;font-size:28px;line-height:1;color:#87000d">{{ g5.sign }}</span></button><sc-if value="{{ g5.open }}" hint-placeholder-val="{{ false }}"><ul style="list-style:none;padding:0 0 12px"><li style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;padding:16px 0;border-bottom:1px solid rgba(18,17,12,.2)"><div style="flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:4px"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px"><span style="font-weight:500">Согласие на обработку персональных данных</span><span style="font-size:12.5px;font-weight:500;background:#2f6b3a;color:#FFFFFF;padding:2px 9px;border-radius:4px">Публично</span></div><p style="font-size:15px;color:#3a3835">Форма согласия для заявок на сайте.</p></div><a href="#request" style="flex:none;align-self:center;font-weight:500;color:#87000d">Скачать</a></li><li style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;padding:16px 0;border-bottom:1px solid rgba(18,17,12,.2)"><div style="flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:4px"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px"><span style="font-weight:500">Политика конфиденциальности</span><span style="font-size:12.5px;font-weight:500;background:#2f6b3a;color:#FFFFFF;padding:2px 9px;border-radius:4px">Публично</span></div><p style="font-size:15px;color:#3a3835">Как АО «Резиденция Тишины Горный Чарыш» обрабатывает персональные данные.</p></div><a href="#request" style="flex:none;align-self:center;font-weight:500;color:#87000d">Скачать</a></li><li style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 20px;padding:16px 0;border-bottom:1px solid rgba(18,17,12,.2)"><div style="flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:4px"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px"><span style="font-weight:500">Подтверждение господдержки</span><span style="font-size:12.5px;font-weight:500;background:#b48a3c;color:#12110c;padding:2px 9px;border-radius:4px">По заявке</span></div><p style="font-size:15px;color:#3a3835">Письмо Минэкономразвития и выписка из реестра инвестиционных проектов.</p></div><a href="#request" style="flex:none;align-self:center;font-weight:500;color:#87000d">Запросить</a></li></ul></sc-if></div></div><p style="font-size:14px;line-height:1.55;color:#6b6762;max-width:90ch">Шаблоны договоров публикуются без персональных данных, реквизиты заменены плейсхолдерами: [ФИО Продавца], [ИНН], [Адрес]. Настоящий документ является шаблоном. Итоговый текст договора определяется сторонами при подписании. Не является публичной офертой.</p><div style="border:1.5px dashed #b48a3c;background:#FBF6EC;border-radius:4px;padding:14px 18px;font-size:14.5px;line-height:1.5;color:#4d3f22"><strong style="color:#8a6a2c">Уточнить до публикации. </strong>В ТЗ правила застройки в одном месте отмечены как публичные, в другом Соглашение о правилах застройки — «по заявке»; поставила «по заявке». Приложение к ДКП называется «Архитектурный регламент коттеджного посёлка «Чарыш»», а в рекламе ТЗ запрещает называть проект коттеджным посёлком — название стоит поменять.</div></div></section>
<section id="nda" style="padding:clamp(56px,8vw,104px) 0;background:#F3EFEA"><div style="max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:32px"><div style="display:flex;flex-wrap:wrap;gap:32px 64px"><div style="flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:16px"><div aria-hidden="true" class="kick" style="display:flex;align-items:center;gap:14px;color:#87000d"><span class="kh"></span><span style="font-size:13px;font-weight:500;letter-spacing:.2em">01</span><span style="flex:0 1 64px;height:1px;background:currentColor;opacity:.5"></span></div><h2 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:clamp(32px,3.8vw,50px);line-height:1.08;font-weight:500;color:#87000d;text-wrap:balance">Как получить закрытые документы</h2><ol style="margin:0;padding:0;list-style:none;border-bottom:1px solid rgba(18,17,12,.25)"><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">1</span><div style="min-width:0"><p style="font-weight:500">Заявка</p><p style="font-size:15.5px;color:#3a3835">Нажмите «Запросить» у нужного документа и оставьте контакты.</p></div></li><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">2</span><div style="min-width:0"><p style="font-weight:500">Звонок менеджера</p><p style="font-size:15.5px;color:#3a3835">Менеджер свяжется с вами в течение 24 часов и объяснит условия.</p></div></li><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">3</span><div style="min-width:0"><p style="font-weight:500">NDA</p><p style="font-size:15.5px;color:#3a3835">Подписываете соглашение о неразглашении электронно или на бумаге.</p></div></li><li style="display:flex;gap:18px;padding:18px 0;border-top:1px solid rgba(18,17,12,.25)"><span style="flex:0 0 36px;font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:32px;line-height:1;font-weight:500;color:#87000d">4</span><div style="min-width:0"><p style="font-weight:500">Доступ на 7 дней</p><p style="font-size:15.5px;color:#3a3835">Присылаем персональную ссылку или PDF на email. Ссылка логируется и через 7 календарных дней закрывается; повторный доступ — по новой заявке.</p></div></li></ol></div><div style="flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:16px"><h3 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:24px;line-height:1.2;font-weight:500;color:#87000d">Что входит в NDA</h3><ul style="padding-left:20px;display:flex;flex-direction:column;gap:8px"><li>Не разглашать информацию третьим лицам.</li><li>Не использовать её в коммерческих целях без согласия.</li><li>Срок действия — 3 года.</li><li>Ответственность за разглашение — возмещение убытков.</li></ul><h3 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:24px;line-height:1.2;font-weight:500;color:#87000d">Электронная подпись</h3><p style="font-size:15.5px"><strong>Можно подписать электронно:</strong> NDA, согласия на обработку и распространение ПД, агентский договор, договор купли-продажи акций (при согласии сторон).</p><p style="font-size:15.5px"><strong>Только на бумаге:</strong> договор купли-продажи участка (для регистрации в Росреестре), договор подряда, договор эксплуатации инфраструктуры.</p><p style="font-size:14px;color:#6b6762">Сервисы: Контур.Подпись, DocuSign, Adobe Sign. Личность подтверждается через СМС-код, Госуслуги или email и телефон.</p></div></div></div></section>
<section id="more" style="padding:clamp(56px,8vw,104px) 0"><div style="max-width:1280px;margin:0 auto;padding:0 clamp(16px,4vw,48px);display:flex;flex-direction:column;gap:32px"><div style="display:flex;flex-wrap:wrap;gap:32px 64px"><div style="flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px"><div aria-hidden="true" class="kick" style="display:flex;align-items:center;gap:14px;color:#87000d"><span class="kh"></span><span style="font-size:13px;font-weight:500;letter-spacing:.2em">02</span><span style="flex:0 1 64px;height:1px;background:currentColor;opacity:.5"></span></div><h2 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:clamp(32px,3.8vw,50px);line-height:1.08;font-weight:500;color:#87000d;text-wrap:balance">Господдержка</h2><p style="font-size:18px"><strong style="color:#87000d">55 млн ₽</strong> по национальному проекту «Туризм и индустрия гостеприимства». Проект включён в реестр инвестиционных проектов.</p><p>Подтверждение — письмо Минэкономразвития (по запросу), ссылка на реестр и скриншот из реестра.</p><p style="font-size:14px;line-height:1.55;color:#6b6762;max-width:90ch">Господдержка не является гарантией доходности. Условия определяются государственным контрактом.</p></div><div style="flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:14px"><div aria-hidden="true" class="kick" style="display:flex;align-items:center;gap:14px;color:#87000d"><span class="kh"></span><span style="font-size:13px;font-weight:500;letter-spacing:.2em">03</span><span style="flex:0 1 64px;height:1px;background:currentColor;opacity:.5"></span></div><h2 style="font-family:'Geometria','Manrope',system-ui,sans-serif;font-size:clamp(32px,3.8vw,50px);line-height:1.08;font-weight:500;color:#87000d;text-wrap:balance">Особенности сделок с акциями</h2><ul style="padding-left:20px;display:flex;flex-direction:column;gap:8px"><li>Продавец акций — Принципал (физическое лицо).</li><li>Покупатель становится акционером только после приходной записи регистратора.</li><li>Покупка акций не является займом, вкладом, депозитом, доверительным управлением или оплатой услуги.</li><li>Акции могут быть неликвидными; дивиденды и рост стоимости не гарантированы.</li><li>Акционер не получает прямого права на имущество Общества.</li><li>НДФЛ платит продавец-физлицо, если владел акциями меньше 5 лет.</li><li>Действует преимущественное право акционеров и Общества.</li></ul></div></div></div></section>
