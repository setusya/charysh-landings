<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Чарыш — деревенский курорт в предгорьях Алтая</title>
<meta name="description" content="Инвестиционный проект «Деревенский курорт Чарыш»: 62 га в собственности на берегу реки Чарыш, 4 часа от аэропорта Барнаул. Туристско-рекреационный комплекс 4★, предложения для инвесторов — IRR от 18%.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="privatecamps.css">
<link rel="stylesheet" href="charysh.css">
</head>
<body class="tone-warm accent-red type-s cards-bordered">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/RapportStrip.jsx"></script>
<script type="text/babel" src="components/CharyshSite.jsx"></script>

<script type="text/babel">
function CharyshApp() {
  React.useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((es) => {
      es.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
    }, { rootMargin: '0px 0px -10% 0px' });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <div data-screen-label="Charysh — сайт проекта">
      <CSHeader />

      {/* Слайд 1 — открытие */}
      <CSHero />

      {/* Слайд 2 — локация + карта + инфраструктура */}
      <CSLocation />

      {/* Слайд 3 — основной сценарий развития */}
      <CSScenario />

      <RapportStrip variant={2} tone="redOnWhite" height={48} />

      {/* Слайд 4 — целевая аудитория */}
      <CSAudience />

      {/* Слайд 5 — экономика */}
      <CSEconomics />

      {/* Лист 6 — предложения для инвесторов + УК «Чарыш Холдинг» и команда */}
      <CSInvest />

      {/* Лист 7 — контакты */}
      <CSContacts />

      <RapportStrip variant={3} tone="goldOnBlack" height={56} />
      <CSFooter />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<CharyshApp />);
</script>
</body>
</html>
