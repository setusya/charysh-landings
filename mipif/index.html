<base href="../">
<script>
// С <base> ссылки вида href="#id" ведут на корень сайта — перехватываем и просто скроллим.
document.addEventListener("click", function (e) {
  var a = e.target.closest && e.target.closest("a[href^='#']");
  if (!a) return;
  e.preventDefault();
  var id = a.getAttribute("href").slice(1);
  var el = id && document.getElementById(id);
  if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); history.replaceState(null, "", "#" + id); }
  else if (!id) { window.scrollTo({ top: 0, behavior: "smooth" }); }
});
</script>

  React.useEffect(() => {

    const io = new IntersectionObserver((es) => {
      es.forEach(e => { if (e.isIntersecting) e.target.classList.add('in'); });
    }, { rootMargin: '0px 0px -10% 0px' });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);

  return (
    <div data-screen-label="00 МИПИФ — Курортная деревня Чарыш">

        h1={<>Курортная деревня<br/>Чарыш</>}
        sub={<><strong>Проект — новое открытие на&nbsp;Алтае.</strong> 32&nbsp;га в&nbsp;собственности в&nbsp;тупиковой долине реки Чарыш. Бюджет 2,9&nbsp;млрд&nbsp;₽, открытие первой очереди — апрель 2028. <strong>Продаём акции курорта и&nbsp;арендные виллы с&nbsp;землёй в&nbsp;собственности.</strong></>}
        primaryCtaText="Что продаём"
        primaryCtaHref="#shares"
        secondaryCtaText="Инвест-цифры"
        secondaryCtaHref="#numbers"
        tagline="ПРОЕКТ — НОВОЕ ОТКРЫТИЕ НА АЛТАЕ"
      />

      {/* 02–05 · Что такое Чарыш и почему туда поедут */}
      <MpCharysh num="02" />
      <MpProof num="03" />
      <MpNature num="04" />
      <MpLife num="05" />

      <RapportStrip variant={2} tone="redOnWhite" height={48} />

      {/* 06–07 · Проект и цифры */}
      <MpComplex num="06" />
      <MpArchitecture num="07" />
      <MpNumbers num="08" />

      {/* 08–09 · Что продаём */}
      <MpShares num="09" />
      <MpVilla num="10" />

      {/* 10–11 · Модель, спрос, риски */}
      <MpModel num="11" />
      <MpRisks num="12" />

      {/* 12 · Команда и УК */}
      <PCTeam
        num="13"
        members={CH_TEAM}
        crumbText="Команда и УК"
        h2={<>Заказчик и&nbsp;оператор — <em className="redword">в&nbsp;одном лице</em>.</>}
        lead="УК — заказчик и оператор проекта. Опыт в строительстве и управлении отелем. УТП команды — привлечение групп в низкий сезон. Все члены команды инвестируют в проект сами."
      />

      {/* 13 · Контакты — только Маслак */}
      <PCFinalCTA
        num="14"
        h2={<>Сделаем <em className="redword">индивидуальное предложение</em><br/>под&nbsp;ваш чек.</>}
        lead="От 500 тысяч до 40 млн ₽ — акции, арендная вилла или их сочетание. Финмодель под ваш сценарий, полный пакет документов, условия выкупа. Инвест-брокерам — партнёрские условия."

  );
}
