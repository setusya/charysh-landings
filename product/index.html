<script>
// С <base> ссылки вида href="#id" ведут на корень сайта — перехватываем и просто скроллим.
document.addEventListener("click", function (e) {
  var a = e.target.closest && e.target.closest("a[href^='#']");
  if (!a) return;
  e.preventDefault();
  var id = a.getAttribute("href").slice(1);
  var el = id && document.getElementById(id);
  if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); history.replaceState(null, "", location.pathname + location.search + "#" + id); }
  else if (!id) { window.scrollTo({ top: 0, behavior: "smooth" }); }
});
</script>

        members={CH_TEAM}
        crumbText="Команда и УК"
        lead="УК — заказчик и оператор проекта в одном лице. Опыт в строительстве и управлении отелем. Все члены команды инвестируют в проект сами."
