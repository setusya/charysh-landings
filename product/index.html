<base href="../">
<script>
// С <base> ссылки вида href="#id" ведут на корень сайта — перехватываем и просто скроллим.
document.addEventListener("click", function (e) {
  var a = e.target.closest && e.target.closest("a[href^='#']");
  if (!a) return;
  e.preventDefault();
  var id = a.getAttribute("href").slice(1);
  var el = id && document.getElementById(id);
  if (el) { el.scrollIntoView({ behavior: "smooth", block: "start" }); history.replaceState(null, "", location.pathname + location.search + "#" + id); }
  else if (!id) { window.scrollTo({ top: 0, behavior: "smooth" }); }
});
</script>

function BreakfastApp() {
  React.useEffect(() => {

      {/* 08 · Команда — роли как в финансовой презентации */}

      {/* 09 · Рендер мастер-плана */}

      {/* 10–11 · Тренды → пять драйверов */}
      <PCTrends num="10" />
      <PCSecurity num="11" />

      {/* 12 · Эксклюзив → 13 · Контакты */}
      <PCBonus num="12" audience={'участников бизнес-завтрака'} />
      <PCFinalCTA num="13" contacts={[CH_CONTACT_ANTONOVA, CH_CONTACT_MASLAK]} />
      <RapportStrip variant={3} tone="goldOnBlack" height={56} />

}
